# Weekly dependency updates, minor and patch only (grouped in one pull request per app to keep the noise low).
# Major versions (Next.js 16, Tailwind 4, React 19, TypeScript 7, Node 26...) are migrations to plan on purpose, not
# something to merge from a bot: they are ignored here. Security updates are not affected by this rule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/api
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      api-minor-and-patch: { update-types: [minor, patch] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      web-minor-and-patch: { update-types: [minor, patch] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /apps/api
    schedule: { interval: weekly, day: monday }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
