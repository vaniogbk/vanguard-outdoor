name: CI
on:
  push: { branches: [main] }
  pull_request:

# the workflow only reads the repository: a compromised dependency or action cannot push, tag or edit settings with it
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: vanguard, POSTGRES_PASSWORD: vanguard, POSTGRES_DB: vanguard }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: apps/api } }
    env:
      DATABASE_URL: postgresql://vanguard:vanguard@localhost:5432/vanguard
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/api/package-lock.json }
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_SITE_URL: https://example.com
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      # critical only: the two remaining alerts sit in the CSS compiler bundled with Next.js (fixed by Next 16, build-time only)
      - run: npm audit --omit=dev --audit-level=critical
      - run: npx tsc --noEmit
      - run: npm run build
